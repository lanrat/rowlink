# Runs the tests on every push and pull request; on main, publishes the app to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*  # always the current Node LTS
      - run: npm ci
      - run: npm test

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site (app files only, plus sample captures for Replay)
        run: |
          mkdir -p _site/captures
          cp -r web/index.html web/css web/js web/icons _site/
          cp captures/*.jsonl _site/captures/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
